name: release-binaries

# release-please pushes the tag with the org PAT, which fires this workflow;
# goreleaser builds the archives and attaches them to the release that
# already exists for the tag. Recovery for a partial upload: run it by hand
# from the Actions tab with the tag selected as the ref; existing assets are
# replaced (replace_existing_artifacts in .goreleaser.yaml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.18.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
